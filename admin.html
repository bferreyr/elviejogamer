<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel Administrativo - El Viejo Gamer</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;700;900&display=swap" rel="stylesheet">
    <style>
        body {
            background: var(--bg-main, #0f0f13);
            color: var(--text-main, #f0f0f0);
            font-family: 'Outfit', sans-serif;
            margin: 0;
            padding: 0;
        }
        
        .admin-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 2rem;
        }

        .admin-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 3rem;
            padding-bottom: 1rem;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .admin-header h1 {
            color: var(--primary, #4ade80);
            margin: 0;
        }

        .btn-back {
            color: var(--text-muted, #9ca3af);
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            transition: color 0.3s ease;
        }
        
        .btn-back:hover {
            color: white;
        }

        .dashboard-grid {
            display: grid;
            grid-template-columns: 1fr 2fr;
            gap: 2rem;
        }

        @media (max-width: 900px) {
            .dashboard-grid {
                grid-template-columns: 1fr;
            }
        }

        .admin-card {
            background: rgba(25, 25, 30, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 12px;
            padding: 2rem;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            backdrop-filter: blur(10px);
        }

        .admin-card h2 {
            margin-top: 0;
            margin-bottom: 1.5rem;
            font-size: 1.5rem;
            color: white;
            border-bottom: 2px solid var(--primary, #4ade80);
            display: inline-block;
            padding-bottom: 0.5rem;
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 500;
            color: #d1d5db;
        }

        .form-group input {
            width: 100%;
            padding: 0.8rem;
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 6px;
            color: white;
            font-family: inherit;
            transition: border-color 0.3s ease;
            box-sizing: border-box;
        }

        .form-group input:focus {
            outline: none;
            border-color: var(--primary, #4ade80);
        }

        .primary-btn {
            width: 100%;
            cursor: pointer;
            border: none;
            padding: 1rem;
            font-size: 1.1rem;
            font-weight: bold;
            border-radius: 6px;
            background: var(--primary, #4ade80);
            color: #000;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .primary-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(74, 222, 128, 0.3);
        }

        .primary-btn:disabled {
            background: #4b5563;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        #status {
            margin-top: 1rem;
            font-weight: 500;
            text-align: center;
        }

        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 1.5rem;
            margin-top: 1.5rem;
        }

        .gallery-item {
            position: relative;
            border-radius: 8px;
            overflow: hidden;
            aspect-ratio: 16/9;
            background: #000;
            group: item;
        }

        .gallery-item img, .gallery-item video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .delete-btn {
            position: absolute;
            top: 10px;
            right: 10px;
            background: rgba(239, 68, 68, 0.9);
            color: white;
            border: none;
            border-radius: 4px;
            padding: 0.5rem;
            cursor: pointer;
            opacity: 0;
            transition: opacity 0.3s ease;
            font-weight: bold;
        }

        .gallery-item:hover .delete-btn {
            opacity: 1;
        }

        .delete-btn:hover {
            background: rgb(220, 38, 38);
        }
        
        .global-password {
            margin-bottom: 2rem;
        }
    </style>
</head>
<body>

    <div class="admin-container">
        <header class="admin-header">
            <h1>Panel Administrativo</h1>
            <a href="galeria.html" class="btn-back">&larr; Volver a la galería</a>
        </header>

        <div class="global-password admin-card" style="padding: 1.5rem;">
            <div class="form-group" style="margin-bottom: 0; max-width: 400px;">
                <label for="admin-password">Contraseña Maestra (Requerida para acciones):</label>
                <input type="password" id="admin-password" placeholder="Ingresa la contraseña de admin" value="">
            </div>
        </div>

        <div class="dashboard-grid">
            <!-- Upload Section -->
            <div class="admin-card">
                <h2>Subir Evento</h2>
                <form id="uploadForm">
                    <div class="form-group">
                        <label for="media">Foto o Video:</label>
                        <input type="file" id="media" accept="image/*,video/*" required>
                    </div>
                    
                    <button type="submit" class="primary-btn" id="uploadBtn">Subir Archivo</button>
                </form>
                <div id="status"></div>
            </div>

            <!-- Manage Gallery Section -->
            <div class="admin-card">
                <h2>Administrar Galería</h2>
                <p style="color: var(--text-muted, #9ca3af); font-size: 0.9rem; margin-top: -1rem; margin-bottom: 1.5rem;">Pasa el cursor sobre un elemento para eliminarlo.</p>
                <div class="gallery-grid" id="adminGallery">
                    <!-- Gallery items will be loaded here -->
                </div>
            </div>
        </div>
    </div>

    <script>
        const adminGallery = document.getElementById('adminGallery');
        const adminPasswordInput = document.getElementById('admin-password');

        // Load Gallery
        async function loadGallery() {
            try {
                const res = await fetch('/api/gallery');
                const items = await res.json();
                
                adminGallery.innerHTML = '';
                
                if (items.length === 0) {
                    adminGallery.innerHTML = '<p style="grid-column: 1/-1; color: #9ca3af; text-align: center;">No hay archivos en la galería.</p>';
                    return;
                }

                items.forEach(item => {
                    const div = document.createElement('div');
                    div.className = 'gallery-item';
                    
                    let mediaHtml = '';
                    if (item.type === 'video') {
                        mediaHtml = `<video src="${item.url}" muted></video>`;
                    } else {
                        mediaHtml = `<img src="${item.url}" alt="Gallery item" loading="lazy">`;
                    }
                    
                    div.innerHTML = `
                        ${mediaHtml}
                        <button class="delete-btn" onclick="deleteItem(${item.id})">Eliminar</button>
                    `;
                    
                    adminGallery.appendChild(div);
                });
            } catch (err) {
                console.error("Error loading gallery:", err);
                adminGallery.innerHTML = '<p style="grid-column: 1/-1; color: #ef4444;">Error al cargar la galería.</p>';
            }
        }

        // Delete Item
        async function deleteItem(id) {
            const password = adminPasswordInput.value;
            if (!password) {
                alert("Por favor ingresa la contraseña maestra arriba.");
                adminPasswordInput.focus();
                return;
            }

            if (!confirm("¿Estás seguro de que deseas eliminar este archivo?")) return;

            try {
                const res = await fetch(`/api/gallery/${id}`, {
                    method: 'DELETE',
                    headers: {
                        'Authorization': password
                    }
                });

                if (res.ok) {
                    loadGallery(); // Reload after delete
                } else {
                    const data = await res.json();
                    alert("Error: " + data.error);
                }
            } catch (err) {
                console.error("Error deleting item:", err);
                alert("Error de conexión al eliminar.");
            }
        }

        // Upload Form
        document.getElementById('uploadForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const password = adminPasswordInput.value;
            if (!password) {
                alert("Por favor ingresa la contraseña maestra arriba.");
                adminPasswordInput.focus();
                return;
            }

            const fileInput = document.getElementById('media');
            const file = fileInput.files[0];
            const statusDiv = document.getElementById('status');
            const uploadBtn = document.getElementById('uploadBtn');
            
            if (!file) return;

            const formData = new FormData();
            formData.append('media', file);

            uploadBtn.disabled = true;
            statusDiv.textContent = 'Subiendo...';
            statusDiv.style.color = '#fff';

            try {
                const response = await fetch('/api/upload', {
                    method: 'POST',
                    headers: {
                        'Authorization': password
                    },
                    body: formData
                });

                const data = await response.json();

                if (response.ok) {
                    statusDiv.textContent = '¡Archivo subido exitosamente!';
                    statusDiv.style.color = '#4ade80';
                    fileInput.value = ''; // clear input
                    loadGallery(); // Reload gallery
                    
                    setTimeout(() => { statusDiv.textContent = ''; }, 3000);
                } else {
                    statusDiv.textContent = 'Error: ' + data.error;
                    statusDiv.style.color = '#ef4444';
                }
            } catch (error) {
                statusDiv.textContent = 'Error de conexión.';
                statusDiv.style.color = '#ef4444';
            } finally {
                uploadBtn.disabled = false;
            }
        });

        // Initial Load
        loadGallery();
    </script>
</body>
</html>
