<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Perfil - El Viejo Gamer</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;700;900&display=swap" rel="stylesheet">
    <style>
        body {
            background: var(--bg-main, #0f0f13);
            color: var(--text-main, #f0f0f0);
            font-family: 'Outfit', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 2rem;
        }

        .profile-container {
            background: rgba(25, 25, 30, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 16px;
            padding: 3rem;
            max-width: 600px;
            width: 100%;
            text-align: center;
            box-shadow: 0 10px 40px rgba(0,0,0,0.6);
            backdrop-filter: blur(15px);
        }

        .avatar-container {
            position: relative;
            width: 150px;
            height: 150px;
            margin: 0 auto 2rem;
            border-radius: 50%;
            padding: 5px;
            background: linear-gradient(135deg, var(--primary, #4ade80), #3b82f6);
        }

        .avatar {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
            border: 4px solid var(--bg-main, #0f0f13);
        }

        .profile-name {
            font-size: 2.5rem;
            font-weight: 900;
            margin: 0 0 0.5rem;
            background: linear-gradient(to right, #fff, #a0a0a0);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .steam-id {
            color: var(--text-muted, #9ca3af);
            font-size: 1rem;
            margin-bottom: 2rem;
            font-family: monospace;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 1.5rem;
            margin-bottom: 2.5rem;
        }

        .stat-card {
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.05);
            padding: 1.5rem;
            border-radius: 12px;
            transition: transform 0.3s ease;
        }

        .stat-card:hover {
            transform: translateY(-5px);
            border-color: rgba(255, 255, 255, 0.1);
        }

        .stat-value {
            font-size: 2rem;
            font-weight: 900;
            color: var(--primary, #4ade80);
            margin-bottom: 0.5rem;
        }

        .stat-label {
            color: var(--text-muted, #9ca3af);
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .btn-group {
            display: flex;
            gap: 1rem;
            justify-content: center;
        }

        .btn {
            padding: 0.8rem 2rem;
            border-radius: 8px;
            font-weight: bold;
            text-decoration: none;
            transition: all 0.3s ease;
            font-size: 1.1rem;
        }

        .btn-primary {
            background: var(--primary, #4ade80);
            color: #000;
        }

        .btn-primary:hover {
            box-shadow: 0 0 20px rgba(74, 222, 128, 0.4);
            transform: translateY(-2px);
        }

        .btn-secondary {
            background: rgba(255, 255, 255, 0.1);
            color: white;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.15);
        }

        .btn-danger {
            background: rgba(239, 68, 68, 0.2);
            color: #f87171;
            border: 1px solid rgba(239, 68, 68, 0.3);
        }

        .btn-danger:hover {
            background: rgba(239, 68, 68, 0.4);
            color: white;
        }

        #loading {
            font-size: 1.5rem;
            color: var(--primary);
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% { opacity: 0.5; }
            50% { opacity: 1; }
            100% { opacity: 0.5; }
        }
    </style>
</head>
<body>

    <div id="loading">Cargando perfil...</div>

    <div class="profile-container" id="profileContent" style="display: none;">
        <div class="avatar-container">
            <img id="userAvatar" src="" alt="Avatar" class="avatar">
        </div>
        
        <h1 class="profile-name" id="userName">Cargando...</h1>
        <p class="steam-id" id="userSteamId">SteamID: Cargando...</p>

        <div class="stats-grid">
            <div class="stat-card">
                <div class="stat-value" id="userKd">0.00</div>
                <div class="stat-label">K/D Ratio CS2</div>
            </div>
            <div class="stat-card">
                <div class="stat-value">Próximamente</div>
                <div class="stat-label">Rango Local</div>
            </div>
        </div>

        <div class="btn-group">
            <a href="index.html" class="btn btn-secondary">Volver al Inicio</a>
            <a id="steamLink" href="#" target="_blank" class="btn btn-primary">Ver en Steam</a>
            <a href="/auth/logout" class="btn btn-danger">Cerrar Sesión</a>
        </div>
    </div>

    <script>
        async function loadProfile() {
            try {
                const response = await fetch('/api/current_user');
                
                if (response.ok) {
                    const user = await response.json();
                    
                    document.getElementById('loading').style.display = 'none';
                    document.getElementById('profileContent').style.display = 'block';
                    
                    document.getElementById('userAvatar').src = user.avatar_url;
                    document.getElementById('userName').textContent = user.display_name;
                    document.getElementById('userSteamId').textContent = 'SteamID: ' + user.steam_id;
                    document.getElementById('steamLink').href = user.profile_url;
                    document.getElementById('userKd').textContent = parseFloat(user.kd_ratio).toFixed(2);
                } else {
                    // Not logged in, redirect to home or show error
                    window.location.href = '/';
                }
            } catch (error) {
                console.error('Error fetching profile:', error);
                document.getElementById('loading').textContent = 'Error al cargar perfil';
                document.getElementById('loading').style.color = '#ef4444';
            }
        }

        loadProfile();
    </script>
</body>
</html>
